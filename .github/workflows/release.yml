# StarCourse 发版流水线
# 触发：推送 v* 标签（如 v2.0.0），或手动 workflow_dispatch
# 产物：Windows / macOS 双平台单文件程序 zip，并自动创建 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 允许手动触发（无标签时使用 github.ref_name 作为版本号）

permissions:
  contents: write      # softprops/action-gh-release 创建 Release 所需

jobs:
  # ── Windows x64 构建 ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0,<7.0"

      - name: 按 spec 构建单文件 exe
        run: python -m PyInstaller StarCourse.spec --clean --noconfirm

      - name: 打包 zip 产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\StarCourse.exe -DestinationPath release\StarCourse-windows-x64.zip

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarCourse-windows-x64
          path: release/StarCourse-windows-x64.zip
          if-no-files-found: error

  # ── macOS arm64 构建 ──────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与 PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install "pyinstaller>=6.0,<7.0"

      - name: 按 spec 构建单文件程序
        run: python3 -m PyInstaller StarCourse.spec --clean --noconfirm

      - name: 打包 zip 产物
        run: |
          mkdir -p release
          cd dist && zip -9 -y ../release/StarCourse-macos-arm64.zip StarCourse

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarCourse-macos-arm64
          path: release/StarCourse-macos-arm64.zip
          if-no-files-found: error

  # ── 发布 Release（附自动 changelog） ───────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物目录
        run: |
          mkdir -p release
          cp artifacts/StarCourse-windows-x64/*.zip release/
          cp artifacts/StarCourse-macos-arm64/*.zip release/
          ls -la release/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true   # 基于上一 tag..当前 tag 的提交自动生成 changelog
          draft: false
          prerelease: false
