InfoStr:
  instructions: |-
    StarCourse — 超星学习通课程自动化工具
    使用前请确认您使用的是最新版，防止因为超星系统更新导致的功能失效
    
    使用须知与功能介绍:
    1.本项目支持一键完成的任务点不包括考试与测试
    2.输入密码时会被自动隐藏，防止您的密码被偷窥
    3.项目不能完全保证不被系统识别异常，请理性使用
    4.所有功能均采用发送GET/POST请求包完成，效率更高且占用资源低
  signStr: |-
    1.使用用户名（手机号）与密码进行登录
    2.使用Cookie进行登录
    请选择您的登录方式：
  errSignMode: 

GloConfig:
  timeout: 3  # 全局requests模块的超时时长
  delay: # 全局request请求的延迟时间，防止过快访问导致触发反爬
    enable: True
    time: 0.5 # 支持小数，单位为秒
  headers:
    # User-Agent 由 src.network_utils 在运行时按当前操作系统动态注入真实浏览器 UA
    # （Windows / Linux / macOS 各自匹配），此处仅为降级默认值，正常不会生效
    User-Agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
  debug:
    enable: True  # 是否开启debug模式，即显示更加详细的软件日志
    level: 8

LogConfig:
  max_log_size_mb: 10  # 单日志文件最大大小（MB），超过自动轮转
  max_backup_count: 5  # 保留的日志备份数量
  max_log_age_days: 7  # 日志文件保留天数，超过自动清理
  enable_auto_cleanup: True  # 是否启用自动清理

CacheConfig:
  max_cache_size_mb: 50  # 单缓存文件最大大小（MB），超过自动清理
  max_cache_age_days: 14  # 缓存数据保留天数
  max_cache_items: 10000  # 最大缓存条目数
  enable_auto_cleanup: True  # 是否启用自动清理
  ai_cache_ttl_days: 30  # AI答案缓存有效期
  tiku_cache_ttl_days: 7  # 题库答案缓存有效期
  cookie_cache_ttl_days: 7  # Cookie缓存有效期

FunConfig:
  deal-mission:
    video-mode: 0 # 0为立即完成,1为等时长刷取
    single-thread: false  #是否为单线程刷取，如果为false则会同时启动所有待完成视频节点的线程
    enable-multi-thread: true  # 是否开启多线程并发刷取
    max-concurrent-threads: 7  # 最大并发线程数
    cover-rate: 0.5  # 章节检测覆盖率阈值，低于此值仅保存不提交
    submit-mode: auto  # auto=按覆盖率决定, save=仅保存
    notopen-action: retry  # 遇到关闭任务点时的行为: retry-重试, ask-询问, continue-继续
    speed: 1.5  # 视频播放倍速 (默认1.0, 最大2.0)
    # 注意：并发数不由独立字段配置，实际由上方 enable-multi-thread / max-concurrent-threads 控制
    learning-mode: stage  # 学习模式: stage=闯关(任务点循环重拉+章节门禁) / sequential=顺序 / concurrent=并发 / review=复习
    progress-persistence: true  # 是否启用章节级进度记忆（重启续学）
    video-retry-rounds: 10  # 首次遍历失败任务点（如视频 403/判定延迟）在同一轮内的补刷轮数，0 为关闭
    exhaustive:  # 客观题（单选/判断）答案穷举验证：应对「正确率过低则打回重做」
      enable: false  # 默认关闭；开启后对单选/判断题反复提交直到整卷通过
      interval: 3.0  # 两次提交的最小间隔（秒），防止触发平台风控
      per-question-max-tries: 4  # 单题在爬坡阶段最多尝试次数
      max-submissions: 30  # 单个任务点最大提交次数上限
      backoff-on-fail: 5.0  # 被平台打回后的额外退避（秒）
      max-vars: 10  # 参与穷举的题数上限，超过则放弃穷举
      max-combos: 200  # 候选组合数上限，超过则放弃穷举
    font-decode:  # 字体反混淆：还原 font-cxsecret 动态混淆字体渲染的题干/选项
      enable: false  # 默认关闭；开启前需先运行 tools/build_font_map.py 生成字形映射表
      map-table: 'data/font_map_table.json'  # 映射表路径（相对 engine 目录）；缺失时自动降级返回原文
    vision-ocr:  # 视觉模型 OCR：图片题（题干/选项为图片）经多模态大模型识别为文本后再作答
      enable: false  # 默认关闭；需 AIConfig 中至少一家 OpenAI 兼容的多模态提供商可用
      model: ''  # 视觉模型名覆盖（如 gpt-4o）；留空沿用提供商配置的 model
      max-image-mb: 5  # 单张图片大小上限（MB），超限跳过识别
  set-log:
    delay: 30 # 刷取学习次数的延迟，单位s

TikuConfig:
  provider: ''  # 题库提供商: TikuYanxi, TikuGo, TikuLike, TikuAdapter, AI, SiliconFlow（逗号分隔可多题库轮询回退）
  token: ''  # 题库token（如果需要）
  tikuadapter_url: ''  # TikuAdapter 自建题库服务地址（如 http://localhost:8060，可写到 /adapter-service/search 并带 ?use=...&xxxToken=... 参数；空=禁用）
  api_key: ''  # AI API Key（使用AI题库时需要；请勿填写他人泄露的密钥，请从控制台申请后配置）
  base_url: 'https://api.deepseek.com'  # AI API Base URL
  model: 'deepseek-chat'  # AI模型名称
  delay: 0  # 搜题延迟（秒）
  cover_rate: 0.8  # 覆盖率阈值
  submit: false  # 是否自动提交
  check_llm_connection: true  # 是否检查大模型连接

AIConfig:
  # 多模型 AI 答题配置（GUI「AI 模型设置」的修改写入 config.json 并优先于本段）
  active: deepseek            # 默认提供商
  priority:                   # 调用优先级链：自上而下依次尝试，某家失败自动切换
    - deepseek
    - openai
    - claude
    - wenxin
  timeout: 30                 # 统一请求超时（秒）
  max_retries: 1              # 单提供商可重试错误（超时/限流/5xx）的重试次数
  providers:
    deepseek:
      api_key: ''
      base_url: 'https://api.deepseek.com'
      model: 'deepseek-chat'
      max_tokens: 10
      max_tokens_content: 512
      temperature: 0.0
    openai:
      api_key: ''
      base_url: 'https://api.openai.com'
      model: 'gpt-4o-mini'
      max_tokens: 10
      max_tokens_content: 512
      temperature: 0.0
    claude:
      api_key: ''
      base_url: 'https://api.anthropic.com'
      model: 'claude-3-5-haiku-20241022'
      max_tokens: 10
      max_tokens_content: 512
      temperature: 0.0
    wenxin:
      api_key: ''             # 百度云 Client ID
      secret_key: ''          # 百度云 Client Secret
      base_url: 'https://aip.baidubce.com'
      model: 'ernie-4.0-turbo-8k'
      max_tokens: 10
      max_tokens_content: 512
      temperature: 0.0

SignConfig:
  enable: true  # 是否启用自动签到
  check_interval: 60  # 签到检查间隔（秒）


UserData:
  cookie: ''
  auto-sign: True